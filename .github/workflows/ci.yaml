---
name: CI tests
on: pull_request

jobs:
  # 1. Dynamically find the 3 most recent k8s minor versions that actually
  #    have a published kindest/node image (avoids "manifest unknown" errors
  #    caused by kind lagging behind new k8s releases, and avoids picking
  #    stale versions due to unreliable API ordering).
  get-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Fetch available kindest/node tags
        id: set-matrix
        run: |
          set -euo pipefail

          ALL_TAGS=""
          URL="https://hub.docker.com/v2/repositories/kindest/node/tags"
          PAGE=0
          while [ -n "$URL" ] && [ "$URL" != "null" ] && [ "$PAGE" -lt 20 ]; do
            PAGE=$((PAGE + 1))
            RESP=$(curl -sf "$URL")
            PAGE_TAGS=$(echo "$RESP" | jq -r '.results[].name')
            ALL_TAGS=$(printf '%s\n%s' "$ALL_TAGS" "$PAGE_TAGS")
            URL=$(echo "$RESP" | jq -r '.next // empty')
          done

          echo "Fetched $(echo "$ALL_TAGS" | grep -c '^v') raw tags across $PAGE page(s)"

          # Keep only clean vX.Y.Z tags (skip alpha/beta/rc/sha-suffixed tags)
          TAGS=$(echo "$ALL_TAGS" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -u)

          if [ -z "$TAGS" ]; then
            echo "ERROR: no valid kindest/node tags found" >&2
            exit 1
          fi

          echo "Newest 10 tags found (sanity check):"
          echo "$TAGS" | sort -V -r | head -10

          # Sort as full version strings (sort -V handles v1.9 vs v1.10
          # correctly on its own — no need to split into per-field keys),
          # keep only the newest patch per minor, take top 3 minors
          TOP3=$(echo "$TAGS" \
            | sort -V -r \
            | awk -F. '!seen[$1"."$2]++' \
            | head -n 3)

          echo "Selected top 3 minors:"
          echo "$TOP3"

          VERSIONS=$(echo "$TOP3" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$VERSIONS" >> "$GITHUB_OUTPUT"

  # 2. Run e2e tests across those versions and all three environments
  ci:
    needs: get-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ${{ fromJson(needs.get-versions.outputs.matrix) }}
        environment: [standard, karpenter, node-labels]
        include:
          - environment: standard
            prep-command: make local-test
          - environment: karpenter
            prep-command: make local-test-karpenter
          - environment: node-labels
            prep-command: make local-test-node-labels

    name: ci-${{ matrix.environment }} (${{ matrix.k8s-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: -quiet -exclude=G107 ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Optional: version of golangci-lint to use in form of v1.2 or v1.2.3 or `latest` to use the latest version
          # version: v1.46
          args: -v --timeout 5m ./...

      - name: Install k8s Kind Cluster
        uses: helm/kind-action@v1.14.0
        with:
          install_only: false
          node_image: kindest/node:${{ matrix.k8s-version }}

      - name: Prepare test environment
        run: ${{ matrix.prep-command }}

      - name: Run e2e tests
        run: make e2e-tests