---
name: CI tests
on: pull_request

jobs:
  # 1. Dynamically find the 3 most recent k8s minor versions that actually
  #    have a published kindest/node image (avoids "manifest unknown" errors
  #    caused by kind lagging behind new k8s releases, and avoids picking
  #    stale versions due to unreliable API ordering).
  get-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: -quiet -exclude=G107 ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Optional: version of golangci-lint to use in form of v1.2 or v1.2.3 or `latest` to use the latest version
          # version: v1.46
          args: -v --timeout 5m ./...
      - name: Install k8s Kind Cluster
        uses: helm/kind-action@v1.14.0
        with:
          install_only: true
          version: v0.29.0
      - name: Prepare test environment
        run: make local-test
      - name: Run e2e tests
        run: make e2e-tests
  ci-karpenter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ${{ fromJson(needs.get-versions.outputs.matrix) }}
        environment: [standard, karpenter, node-labels]
        include:
          - environment: standard
            prep-command: make local-test
          - environment: karpenter
            prep-command: make local-test-karpenter
          - environment: node-labels
            prep-command: make local-test-node-labels

    name: ci-${{ matrix.environment }} (${{ matrix.k8s-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: -quiet -exclude=G107 ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Optional: version of golangci-lint to use in form of v1.2 or v1.2.3 or `latest` to use the latest version
          # version: v1.46
          args: -v --timeout 5m ./...

      - name: Install k8s Kind Cluster
        uses: helm/kind-action@v1.14.0
        with:
          install_only: false
          node_image: kindest/node:${{ matrix.k8s-version }}

      - name: Prepare test environment
        run: make local-test-karpenter
      - name: Run e2e tests
        run: make e2e-tests
  ci-node-labels:
    runs-on: ubuntu-latest
    name: ci-node-labels
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: -quiet -exclude=G107 ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Optional: version of golangci-lint to use in form of v1.2 or v1.2.3 or `latest` to use the latest version
          # version: v1.46
          args: -v --timeout 5m ./...
      - name: Install k8s Kind Cluster
        uses: helm/kind-action@v1.14.0
        with:
          install_only: true
          version: v0.29.0
      - name: Prepare test environment
        run: make local-test-node-labels
      - name: Run e2e tests
        run: make e2e-tests